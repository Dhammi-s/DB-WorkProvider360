name: Deploy SQL Database

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:

  deploy:

    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Find SQL Project
        shell: powershell
        run: |
          Get-ChildItem -Recurse -Filter *.sqlproj

      - name: Build SQL Project
        run: |
          msbuild WorkProvider360\WorkProvider360.sqlproj /p:Configuration=Release

      - name: Deploy
        shell: powershell
        env:
          MASTER_DB_CONNECTION: ${{ secrets.MASTER_DB_CONNECTION }}
        run: |
          .\Scripts\Deploy-AllTenants.ps1
