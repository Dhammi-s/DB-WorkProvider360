name: Deploy SQL Database

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build SQL Project
        shell: powershell
        run: |
          msbuild WorkProvider360\WorkProvider360.sqlproj /p:Configuration=Release

      - name: Install SqlPackage
        shell: powershell
        run: |
          dotnet tool install --global microsoft.sqlpackage

      - name: Add SqlPackage To PATH
        shell: powershell
        run: |
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify SqlPackage
        shell: powershell
        run: |
          sqlpackage /Version

      - name: Generate SQL Scripts
        shell: powershell
        run: |
          .\Scripts\Deploy-AllTenants.ps1 -GenerateScript

      - name: Upload SQL Scripts
        uses: actions/upload-artifact@v4
        with:
          name: SQL-Deployment-Scripts
          path: Scripts\Output\*.sql

      - name: Deploy SQL Database
        shell: powershell
        run: |
          .\Scripts\Deploy-AllTenants.ps1

      # SUCCESS EMAIL
      - name: Send Success Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp-relay.brevo.com
          server_port: 587
          secure: false
          username: a06f74001@smtp-brevo.com
          password: <YOUR_BREVO_PASSWORD>

          subject: "✅ SQL Deployment Successful"

          to: jassadhammi@gmail.com
          from: jassadhammi@gmail.com

          body: |
            Hello,

